name: crucible-ci

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}/crucible-ci
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      only-docs: ${{ steps.filter.outputs.only_modified }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: tj-actions/changed-files@v47
        with:
          files: |
            LICENSE
            *.md
            **/*.md
            .github/rulesets/**
            .github/workflows/run-crucible-tracking.yaml
            .github/workflows/fork-check.yaml
            .github/workflows/crucible-ci.yaml
            docs/**
      - name: Display changes
        env:
          FILTER_OUTPUTS_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: printf '%s\n' "$FILTER_OUTPUTS_JSON" | jq .

  call-unittest:
    needs: changes
    if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.only-docs != 'true') }}
    uses: ./.github/workflows/unittest.yaml

  call-real-benchmark-crucible-ci:
    needs: [ changes, call-unittest ]
    if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.only-docs != 'true') }}
    uses: perftool-incubator/crucible-ci/.github/workflows/benchmark-crucible-ci.yaml@main
    with:
      ci_target: "hammerdb"
      ci_target_branch: "${{ github.ref }}"
      github_workspace: "$GITHUB_WORKSPACE"
      userenv_filter: "all"
    secrets:
      ci_registry_auth: ${{ secrets.CRUCIBLE_CI_ENGINES_REGISTRY_AUTH }}
      quay_oauth_token: ${{ secrets.CRUCIBLE_QUAYIO_OAUTH_TOKEN }}

  call-faux-benchmark-crucible-ci:
    needs: changes
    if: ${{ github.event.pull_request.head.repo.fork != true && github.event_name != 'workflow_dispatch' && needs.changes.outputs.only-docs == 'true' }}
    uses: perftool-incubator/crucible-ci/.github/workflows/faux-benchmark-crucible-ci.yaml@main

  crucible-ci-complete:
    needs: [ changes, call-unittest, call-real-benchmark-crucible-ci, call-faux-benchmark-crucible-ci ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Results
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "crucible-ci complete"
